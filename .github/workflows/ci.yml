# 持续集成：静态检查 + 类型检查 + 测试
# 本地等价命令：make check-all
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 依赖（含 numpy<2 这条课件环境约束）全在 pyproject 里
          pip install -e ".[dev]"

      - name: 静态检查（ruff）
        run: ruff check src tests

      - name: 类型检查（mypy）
        run: mypy

      - name: 测试（含覆盖率）
        run: pytest

      - name: 端到端冒烟（跑一遍 CLI 与批量报告）
        run: |
          rkin check
          rkin batch
          rkin pick --observe 0.35 -0.05 0.15
          # 验收：落盘报告的前两段必须与课件交付物的数值逐条一致。
          # 期望值内联在这里（不把课件原件放进仓库分发）。
          grep -qF -- "- ppt_case: cup_base=[0.783  0.1634 0.8   ]" outputs/ppt_cases_batch_result.txt
          grep -qF -- "- fk_60_minus30: FK tool=[1.366 1.366], detJ=-0.500000" outputs/ppt_cases_batch_result.txt
          grep -qF -- "- ik_1_1: IK sols=(0.00°, 90.00°); (90.00°, -90.00°)" outputs/ppt_cases_batch_result.txt
