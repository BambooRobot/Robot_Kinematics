# 持续集成：静态检查 + 类型检查 + 测试
# 本地等价命令：make check-all
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 依赖（含 numpy<2 这条课件环境约束）全在 pyproject 里
          pip install -e ".[dev]"

      - name: 静态检查（ruff）
        run: ruff check src tests

      - name: 类型检查（mypy）
        run: mypy

      - name: 测试（含覆盖率）
        run: pytest

      - name: 端到端冒烟（扁平 CLI 抓取流水线）
        run: |
          rkin --observe 0.2 0 0
          rkin --format json --observe 0.2 0 0 | grep -q outcome
          rkin --observe 2 2 2 | grep -qF "不在工作空间"
