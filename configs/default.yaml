# robot_kinematics_app 运行配置
#
# 命令行参数优先级高于本文件：例如 `rkin --observe 0.2 0 0 --max-iter 100`。
# 程序按相对路径查找本文件与 data/，因此需要在项目根目录下运行。

camera:
  # 相机在机器人本体（base frame）下的安装位姿
  x: 0.30             # [m]
  y: 0.00             # [m]
  z: 0.60             # [m]
  yaw_deg: 30.0       # 相机绕 base 的 z 轴转角 [deg]

ik:
  max_iter: 200       # 最大迭代次数
  tol: 1.0e-9         # 库的关节步长收敛判据

paths:
  cases_dir: data/cases
  outputs_dir: outputs

pick:
  # 抓取任务流水线的参数（对应 rkin --observe ...）
  seeds: 24                  # 多初值 IK 的初值个数（越多越不容易漏解，也越慢）
  residual_tol: 1.0e-4       # 末端残差上限 [m/rad]
  unreachable_residual: 0.02 # 最佳残差超过此值判为"姿态不可达"，否则判为"未收敛"
  min_sigma: 0.02            # 雅可比最小奇异值下限，低于此值判为该解"接近奇异"
  workspace_samples: 8000    # 工作空间采样的姿态数（可达边界是估计值）
  workspace_seed: 0          # 采样种子，固定以保证结论可复现
  limit_margin_deg: 0.0      # 关节限位余量要求 [deg]，0 表示只要不越界即可
